#user nobody;

worker_processes auto;

error_log /var/log/nginx/error_noise_all.log debug;

pid /var/run/nginx.pid;

events {
        worker_connections 1024;
}

noise_socket {
    # 外部客户端直接接入 4430 的 Noise 通道
    server {
        error_log /var/log/nginx/error_noise_all.log debug;
        listen 4430 noise;

        server_private_key_file /etc/noise/server_key_25519;

        proxy_pass local_http;
    }

    # Noise 解密后的 HTTP 请求转发到本地路由入口
    upstream local_http {
        server 127.0.0.1:4431;
    }
}

http {
    include mime.types;
    default_type application/octet-stream;

    # 详细访问日志，便于串联排查 upstream 与请求耗时
    log_format noise_detail '$remote_addr - $remote_user [$time_local] '
                            '"$request" status=$status body_bytes=$body_bytes_sent '
                            'request_time=$request_time upstream_addr="$upstream_addr" '
                            'upstream_status="$upstream_status" upstream_response_time="$upstream_response_time" '
                            'host="$host" uri="$request_uri" args="$args" '
                            'req_id="$request_id" x_request_id="$http_x_request_id" '
                            'xff="$http_x_forwarded_for" ua="$http_user_agent"';
    access_log /var/log/nginx/access_noise_all.log noise_detail;

###For the noise socket connection keepalive setup
    proxy_http_version 1.1;
    keepalive_requests 10;
    keepalive_timeout 50s;
###

    upstream api_backend {
        server 127.0.0.1:7990;
    }

    upstream ws_backend {
        server 127.0.0.1:7991;
    }

    upstream download_backend {
        server 127.0.0.1:7992;
    }

    # 本地 HTTP 路由入口，仅处理完全匹配路径
    server {
        error_log /var/log/nginx/error_noise_all.log debug;
        listen 127.0.0.1:4431;
        server_name localhost;

        location = /api/echo {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }

        location = /ws/echo {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }

        location = /download/dl {
            proxy_pass http://download_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            return 404;
        }
    }
}
